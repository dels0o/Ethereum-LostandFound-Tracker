<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>lost-and-found.sol // local</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.2/ethers.umd.min.js"></script>
<style>
  :root{
    --bg:#0b0e0c;
    --panel:#111511;
    --line:#2a3129;
    --text:#c9d1c5;
    --text-dim:#6f7a6c;
    --lost:#c96b4a;
    --found:#5a9c6a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family: Consolas, 'Courier New', monospace;
    font-size:14px;
    min-height:100vh;
    padding:20px 14px 60px;
  }
  .wrap{max-width:820px;margin:0 auto;}

  header{
    border-bottom:1px solid var(--line);
    padding-bottom:12px;
    margin-bottom:16px;
  }
  header .eyebrow{
    color:var(--text-dim);
    font-size:11px;
  }
  header h1{
    font-size:20px;
    margin:4px 0;
    font-weight:normal;
  }
  header p{margin:0;color:var(--text-dim);font-size:12px;}

  .wallet-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    border:1px solid var(--line);
    padding:8px 12px;
    margin-bottom:18px;
    font-size:12px;
  }
  .wallet-bar .status b{color:var(--found);}
  select{
    font-family:inherit;
    background:var(--bg);
    color:var(--text);
    border:1px solid var(--line);
    padding:5px 8px;
    font-size:12px;
  }
  button{
    font-family:inherit;
    cursor:pointer;
    border:1px solid var(--text-dim);
    background:transparent;
    color:var(--text);
    padding:7px 14px;
    font-size:12px;
  }
  button:hover{border-color:var(--text);color:#fff;}
  button:disabled{opacity:.35;cursor:not-allowed;}
  button.small{padding:4px 10px;font-size:11px;}

  .panel{
    border:1px solid var(--line);
    padding:14px;
    margin-bottom:20px;
  }
  .panel-label{
    color:var(--text-dim);
    font-size:11px;
    margin-bottom:10px;
  }
  .grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  .field{display:flex;flex-direction:column;gap:3px;}
  label{font-size:11px;color:var(--text-dim);}
  input{
    font-family:inherit;
    background:var(--bg);
    border:1px solid var(--line);
    padding:7px;
    font-size:13px;
    color:var(--text);
  }
  input:focus{outline:1px solid var(--text-dim);}
  .submit-row{margin-top:12px;display:flex;justify-content:flex-end;}

  .board-head{
    display:flex;
    justify-content:space-between;
    color:var(--text-dim);
    font-size:11px;
    margin-bottom:8px;
    border-bottom:1px solid var(--line);
    padding-bottom:6px;
  }

  #cards{display:flex;flex-direction:column;gap:1px;}
  .row{
    border:1px solid var(--line);
    padding:10px 12px;
    font-size:12px;
  }
  .row-top{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:6px;
  }
  .row-top .name{font-size:14px;color:var(--text);}
  .status-tag{font-size:10px;letter-spacing:.05em;}
  .status-tag.lost{color:var(--lost);}
  .status-tag.found{color:var(--found);}
  .row .line{color:var(--text-dim);margin:2px 0;}
  .row .line b{color:var(--text);font-weight:normal;}
  .chain-info{
    margin-top:8px;
    padding-top:8px;
    border-top:1px dashed var(--line);
    font-size:11px;
    color:var(--text-dim);
    word-break:break-all;
  }
  .chain-info .k{color:var(--text-dim);}
  .row .actions{margin-top:8px;text-align:right;}

  .empty{
    padding:30px 10px;
    text-align:center;
    color:var(--text-dim);
    border:1px dashed var(--line);
    font-size:12px;
  }
  .toast{
    position:fixed;
    bottom:16px;left:50%;
    transform:translateX(-50%);
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--text);
    padding:10px 16px;
    font-size:12px;
    opacity:0;
    transition:opacity .2s ease;
    pointer-events:none;
    max-width:90%;
    z-index:50;
  }
  .toast.show{opacity:1;}
  .toast.error{border-color:var(--lost);color:var(--lost);}
  .toast.success{border-color:var(--found);color:var(--found);}

  @media (max-width:560px){
    .grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="eyebrow">lost & found DApp </div>
    <h1> Laporan Barang Hilang</h1>
    <p>Aplikasi berbasis blockchain untuk melaporkan barang hilang dan memperbarui status barang.</p>
  </header>

  <div class="wallet-bar">
    <div class="status" id="walletStatus"><b>connecting...</b></div>
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
      <select id="accountSelect">
        <option value="0">Akun 1 0xf39F...2266</option>
        <option value="1">Akun 2 0x7099...79C8</option>
        <option value="2">Akun 3 0x3C44...293BC</option>
        <option value="3">Akun 4 0x90F7...93b906</option>
      </select>
    </div>
  </div>

  <div class="panel">
    <div class="panel-label">Form Laporan Barang Hilang</div>
    <div class="grid">
      <div class="field">
        <label for="name">Nama barang</label>
        <input id="name" type="text" placeholder="cth: Dompet kulit coklat">
      </div>
      <div class="field">
        <label for="category">Kategori</label>
        <input id="category" type="text" placeholder="cth: Aksesoris">
      </div>
      <div class="field">
        <label for="location">Lokasi ditemukan</label>
        <input id="location" type="text" placeholder="cth: Perpustakaan lt. 2">
      </div>
      <div class="field">
        <label for="description">Deskripsi barang</label>
        <input id="description" type="text" placeholder="cth: Warna hitam, ada goresan">
      </div>
    </div>
    <div class="submit-row">
      <button id="reportBtn" disabled>Laporkan Barang</button>
    </div>
  </div>

  <div class="board-head">
    <span>Daftar Laporan Barang</span>
    <span id="itemCountLabel">0 item</span>
  </div>

  <div id="cards">
    <div class="empty" id="emptyState">Belum ada laporan barang hilang. Silakan laporkan barang pertama</div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
const CONTRACT_ADDRESS = "0x2279B7A0a67DB372996a5FaB50D91eAA73d2eBe6";
const RPC_URL = "http://127.0.0.1:8545";

// ============================================================
// !! HANYA UNTUK DEMO LOKAL DI ANVIL !!
// Private key ini adalah akun-akun default bawaan Anvil (publik, dikenal semua orang,
// sama persis tiap kali anvil dijalankan). JANGAN PERNAH pakai pola ini di aplikasi
// production / network publik / mainnet — siapapun yang buka file ini bisa lihat & pakai
// private key-nya.
// ============================================================
const DEMO_ACCOUNTS = [
  "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80", // Akun 0
  "0x59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d", // Akun 1
  "0x5de4111afa1a4b94908f83103eb1f1706367c2e68ca870fc3fb9a804cdab365a", // Akun 2
  "0x7c852118294e51e653712a81e05800f419141751be58f605c371e15141b007a6", // Akun 3
];

const ABI = [
  {"type":"function","name":"getItem","inputs":[{"name":"_id","type":"uint256"}],"outputs":[{"name":"","type":"tuple","components":[
    {"name":"id","type":"uint256"},
    {"name":"name","type":"string"},
    {"name":"category","type":"string"},
    {"name":"location","type":"string"},
    {"name":"description","type":"string"},
    {"name":"found","type":"bool"},
    {"name":"reporter","type":"address"}
  ]}],"stateMutability":"view"},
  {"type":"function","name":"itemCount","inputs":[],"outputs":[{"name":"","type":"uint256"}],"stateMutability":"view"},
  {"type":"function","name":"markAsFound","inputs":[{"name":"_id","type":"uint256"}],"outputs":[],"stateMutability":"nonpayable"},
  {"type":"function","name":"reportItem","inputs":[
    {"name":"_name","type":"string"},
    {"name":"_category","type":"string"},
    {"name":"_location","type":"string"},
    {"name":"_description","type":"string"}
  ],"outputs":[],"stateMutability":"nonpayable"},
  {"type":"event","name":"ItemFound","inputs":[{"name":"id","type":"uint256","indexed":false}],"anonymous":false},
  {"type":"event","name":"ItemReported","inputs":[
    {"name":"id","type":"uint256","indexed":false},
    {"name":"name","type":"string","indexed":false},
    {"name":"reporter","type":"address","indexed":false}
  ],"anonymous":false}
];

let provider, signer, contract, readContract, currentAccount = null;

const el = {
  accountSelect: document.getElementById('accountSelect'),
  walletStatus: document.getElementById('walletStatus'),
  reportBtn: document.getElementById('reportBtn'),
  cards: document.getElementById('cards'),
  emptyState: document.getElementById('emptyState'),
  itemCountLabel: document.getElementById('itemCountLabel'),
  toast: document.getElementById('toast'),
};

function showToast(msg, type=''){
  el.toast.textContent = msg;
  el.toast.className = 'toast show ' + type;
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>{ el.toast.classList.remove('show'); }, 4000);
}

function shortAddr(a){
  return a.slice(0,6) + '…' + a.slice(-4);
}

// Read-only provider so the board loads even before wallet connects
function getReadContract(){
  if(!readContract){
    const roProvider = new ethers.JsonRpcProvider(RPC_URL);
    readContract = new ethers.Contract(CONTRACT_ADDRESS, ABI, roProvider);
  }
  return readContract;
}

async function connectWallet(){
  try{
    const accountIndex = Number(el.accountSelect.value);
    const privateKey = DEMO_ACCOUNTS[accountIndex];

    provider = new ethers.JsonRpcProvider(RPC_URL);
    signer = new ethers.Wallet(privateKey, provider);
    currentAccount = signer.address;
    contract = new ethers.Contract(CONTRACT_ADDRESS, ABI, signer);

    el.walletStatus.innerHTML = `<b>connected:</b> ${shortAddr(currentAccount)}`;
    el.reportBtn.disabled = false;

    showToast('Berhasil terhubung menggunakan Akun ' + (accountIndex + 1), 'success');
    loadItems();
  }catch(err){
    console.error(err);
    el.walletStatus.innerHTML = `<b>connection failed.</b> cek anvil di ${RPC_URL}`;
    showToast('connect failed: ' + (err.reason || err.message), 'error');
  }
}

async function reportItem(){
  const name = document.getElementById('name').value.trim();
  const category = document.getElementById('category').value.trim();
  const location = document.getElementById('location').value.trim();
  const description = document.getElementById('description').value.trim();

  if(!name || !category || !location || !description){
    showToast('Silakan lengkapi seluruh data terlebih dahulu.', 'error');
    return;
  }
  if(!contract){
    showToast('Silakan hubungkan akun terlebih dahulu.', 'error');
    return;
  }

  el.reportBtn.disabled = true;
  el.reportBtn.textContent = 'pending...';
  try{
    const tx = await contract.reportItem(name, category, location, description);
    showToast('Mengirim laporan: ' + tx.hash);
    await tx.wait();
    showToast('Laporan berhasil disimpan ke blockchain.', 'success');
    document.getElementById('name').value = '';
    document.getElementById('category').value = '';
    document.getElementById('location').value = '';
    document.getElementById('description').value = '';
    loadItems();
  }catch(err){
    console.error(err);
    showToast('Transaksi gagal diproses: ' + (err.reason || err.message), 'error');
  }finally{
    el.reportBtn.disabled = false;
    el.reportBtn.textContent = 'laporkan barang';
  }
}

async function markFound(id, btn){
  if(!contract){
    showToast('sambungkan akun dulu.', 'error');
    return;
  }
  btn.disabled = true;
  btn.textContent = '...';
  try{
    const tx = await contract.markAsFound(id);
    showToast('Mengirim: ' + tx.hash);
    await tx.wait();
    showToast('confirmed. item #' + id + ' -> found', 'success');
    loadItems();
  }catch(err){
    console.error(err);
    showToast('tx failed: ' + (err.reason || err.message), 'error');
    btn.disabled = false;
    btn.textContent = 'markAsFound()';
  }
}

function renderItem(item){
  const found = item.found;
  const row = document.createElement('div');
  row.className = 'row';
  row.innerHTML = `
    <div class="row-top">
      <span class="Name">#${item.id} ${escapeHtml(item.name)}</span>
      <span class="status-tag ${found ? 'found' : 'lost'}">${found ? '[FOUND]' : '[LOST]'}</span>
    </div>
    <div class="line">Kategori: <b>${escapeHtml(item.category)}</b> &nbsp; Lokasi ditemukan: <b>${escapeHtml(item.location)}</b></div>
    <div class="line">Deskripsi: ${escapeHtml(item.description)}</div>
    <div class="line">Pelapor: ${item.reporter}</div>
    <div class="chain-info">
      <span class="k">Hash Transaksi:</span> ${item.reportTx || '-'}<br>
      <span class="k">No block:</span> ${item.reportBlock ?? '-'}${item.foundTx ? `<br><span class="k">Hash update status:</span> ${item.foundTx}` : ''}
    </div>
    <div class="actions"></div>
  `;
  if(!found){
    const btn = document.createElement('button');
    btn.className = 'small';
    btn.textContent = 'Tandai Sudah Ditemukan';
    btn.disabled = !contract || currentAccount.toLowerCase() !== item.reporter.toLowerCase();
    btn.title = btn.disabled ? 'hanya pelapor asli yang bisa update' : '';
    btn.addEventListener('click', () => markFound(item.id, btn));
    row.querySelector('.actions').appendChild(btn);
  }
  return row;
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

async function loadItems(){
  try{
    const c = getReadContract();
    const count = await c.itemCount();
    const total = Number(count);
    el.itemCountLabel.textContent = total + ' item';

    el.cards.innerHTML = '';
    if(total === 0){
      el.cards.appendChild(el.emptyState);
      return;
    }

    // Ambil bukti tx hash langsung dari event log on-chain
    const reportedLogs = await c.queryFilter(c.filters.ItemReported());
    const foundLogs = await c.queryFilter(c.filters.ItemFound());
    const reportedMap = {};
    reportedLogs.forEach(log => {
      reportedMap[Number(log.args.id)] = { txHash: log.transactionHash, blockNumber: log.blockNumber };
    });
    const foundMap = {};
    foundLogs.forEach(log => {
      foundMap[Number(log.args.id)] = log.transactionHash;
    });

    const items = [];
    for(let i = 1; i <= total; i++){
      const raw = await c.getItem(i);
      items.push({
        id: Number(raw.id),
        name: raw.name,
        category: raw.category,
        location: raw.location,
        description: raw.description,
        found: raw.found,
        reporter: raw.reporter,
        reportTx: reportedMap[i]?.txHash,
        reportBlock: reportedMap[i]?.blockNumber,
        foundTx: foundMap[i]
      });
    }
    // Terbaru di atas
    items.reverse().forEach(item => el.cards.appendChild(renderItem(item)));
  }catch(err){
    console.error(err);
    el.cards.innerHTML = '';
    const errBox = document.createElement('div');
    errBox.className = 'empty';
    errBox.textContent = 'gagal query contract. cek anvil masih jalan di ' + RPC_URL;
    el.cards.appendChild(errBox);
  }
}

el.reportBtn.addEventListener('click', reportItem);
el.accountSelect.addEventListener('change', connectWallet);

// Mode demo: auto-connect pakai akun terpilih di dropdown (default Akun 0), tanpa perlu klik apapun
connectWallet();
</script>
</body>
</html>
